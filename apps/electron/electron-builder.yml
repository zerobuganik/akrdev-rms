{
  "appId": "com.topshe.pos",
  "productName": "Topshe POS",
  "directories": {
    "output": "release",
    "buildResources": "build"
  },
  "files": [
    "dist/**/*",
    "data/**/*",
    "!data/*.db-journal",
    "node_modules/**/*",
    "!node_modules/.cache/**"
  ],
  "asarUnpack": [
    "node_modules/@luckykiet/node-printer/**",
    "node_modules/argon2/**",
    "node_modules/@prisma/adapter-libsql/**",
    "data/**"
  ],
  "extraResources": [
    { "from": "../pos/dist", "to": "pos-dist" }
  ],
  "win": {
    "target": [
      { "target": "nsis", "arch": ["x64"] }
    ],
    "icon": "build/icon.ico",
    "signAndEditExecutable": false
  },
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true,
    "createDesktopShortcut": true,
    "createStartMenuShortcut": true
  }
}
